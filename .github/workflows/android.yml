
name: Build NOVA PLAYER APK

on:
  workflow_dispatch:
  push:
    paths:
      - "nova-player-source.zip"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Unpack project
        run: |
          mkdir -p nova-player-source
          unzip -o nova-player-source.zip -d nova-player-source

      - name: Build debug APK
        run: gradle -p nova-player-source assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-PLAYER-debug-APK
          path: nova-player-source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
